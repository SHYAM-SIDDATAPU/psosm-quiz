const app=document.getElementById('app'),L='ABCDEFGH';
let S=null;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function home(){
 S=null;
 app.innerHTML='<h1>PSOSM Quiz</h1><p class="sub">Privacy and Security in Online Social Media – pick a year, then answer one question at a time.</p><div class="yrs">'+
 Object.keys(D).sort().reverse().map(y=>{const ws=[...new Set(D[y].map(q=>q.w))];return `<button class="yr" data-y="${y}"><b>${y}</b><span>${D[y].length} questions · Weeks ${ws[0]}–${ws[ws.length-1]}</span></button>`}).join('')+'</div>';
 app.querySelectorAll('.yr').forEach(b=>b.onclick=()=>pick(b.dataset.y));
}
function pick(y){
 const ws=[...new Set(D[y].map(q=>q.w))];
 app.innerHTML=`<button class="back" id="bk">← All years</button><h1>${y}</h1><p class="sub">${D[y].length} questions in total.</p><div class="card"><label>Week: <select id="wk"><option value="0">All weeks (${D[y].length})</option>${ws.map(w=>`<option value="${w}">Week ${w} (${D[y].filter(q=>q.w==w).length})</option>`).join('')}</select></label><div class="row"><button class="b" id="go">Start quiz</button></div></div>`;
 document.getElementById('bk').onclick=home;
 document.getElementById('go').onclick=()=>{const w=+document.getElementById('wk').value;S={y,qs:D[y].filter(q=>!w||q.w==w),i:0,sel:[],done:false,res:[],w};show()};
}
function show(){
 const q=S.qs[S.i],multi=q.a.length>1;
 app.innerHTML=`<button class="back" id="bk">← Quit</button><div class="card"><div class="meta"><span>${S.y}${S.w?' · Week '+S.w:' · Week '+q.w}</span><span>Question ${S.i+1} of ${S.qs.length}</span></div><div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div>
 <div class="q">${esc(q.q)}</div>${multi?'<div class="hint">Select all correct answers ('+q.a.length+')</div>':''}
 <div id="os">${q.o.map((t,i)=>`<button class="o" data-i="${i}"><span class="k">${L[i]}</span><span>${esc(t)}</span></button>`).join('')}</div><div id="fb"></div>
 <div class="row"><button class="b" id="ck" disabled>Check answer</button><button class="b g" id="nx" style="display:none"></button></div></div>`;
 document.getElementById('bk').onclick=home;
 S.sel=[];S.done=false;
 const ob=[...app.querySelectorAll('.o')],ck=document.getElementById('ck'),nx=document.getElementById('nx');
 ob.forEach(b=>b.onclick=()=>{if(S.done)return;const i=+b.dataset.i;
  if(multi){S.sel=S.sel.includes(i)?S.sel.filter(x=>x!=i):[...S.sel,i]}else S.sel=[i];
  ob.forEach((x,j)=>x.classList.toggle('s',S.sel.includes(j)));ck.disabled=!S.sel.length});
 ck.onclick=()=>{
  S.done=true;const ok=S.sel.length==q.a.length&&q.a.every(a=>S.sel.includes(a));
  S.res.push({q,sel:[...S.sel],ok});
  ob.forEach((x,j)=>{x.disabled=true;x.classList.remove('s');if(q.a.includes(j))x.classList.add('ok');else if(S.sel.includes(j))x.classList.add('no')});
  const ex=q.e?'\n'+q.e:'';
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'Correct!':'Not quite. Correct: '+q.a.map(a=>L[a]).join(', ')}${esc(ex)}</div>`;
  ck.style.display='none';nx.style.display='';nx.className='b';nx.textContent=S.i+1<S.qs.length?'Next question →':'See results';
  nx.onclick=()=>{S.i++;S.i<S.qs.length?show():results()};nx.focus()};
}
function results(){
 const n=S.res.filter(r=>r.ok).length,t=S.qs.length;
 app.innerHTML=`<div class="card"><h1>${S.y} results</h1><div class="big">${n} / ${t}</div><p class="sub">${Math.round(n/t*100)}% correct</p><div class="row"><button class="b" id="rt">Retry</button><button class="b g" id="hm">All years</button></div></div>
 <div class="card" style="margin-top:14px"><b>Review</b>${S.res.map((r,i)=>`<div class="rv"><b class="${r.ok?'ok':'no'}">${r.ok?'✓':'✗'}</b> ${i+1}. ${esc(r.q.q)}\nYou: ${r.sel.map(a=>L[a]).join(', ')} · Correct: ${r.q.a.map(a=>L[a]).join(', ')}</div>`).join('')}</div>`;
 document.getElementById('hm').onclick=home;
 document.getElementById('rt').onclick=()=>{S={...S,i:0,res:[]};show()};
}
home();
</script></body></html>
